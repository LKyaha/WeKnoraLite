name: Windows Lite Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-lite.yml"
      - "cmd/desktop/**"
      - "frontend/**"
      - "cli/**"
      - "client/**"
      - "scripts/**"
      - "config/**"
      - "migrations/sqlite/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: windows-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Build WeKnora Lite Desktop
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      GOLANG_PROTOBUF_REGISTRATION_CONFLICT: warn
      CGO_CFLAGS: -Wno-deprecated-declarations
      EDITION: lite
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend and validate runtime resources
        shell: bash
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          test -s frontend/dist/index.html
          test -s frontend/dist/embed.html
          test -d frontend/dist/assets
          test -s config/config.yaml
          test -s .env.lite.example
          test -d migrations/sqlite
          test -n "$(find migrations/sqlite -name '*.up.sql' -print -quit)"
          echo "Frontend, config and SQLite migration resources exist before NSIS packaging"

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Normalize license manifest line endings
        shell: bash
        run: |
          sed -i 's/\r$//' licenses/sources/modules.tsv go.mod

      - name: Prepare SQLite header for sqlite-vec
        shell: bash
        run: |
          go mod download github.com/mattn/go-sqlite3 github.com/asg017/sqlite-vec-go-bindings
          SQLITE3_DIR="$(go list -m -f '{{.Dir}}' github.com/mattn/go-sqlite3)"
          VEC_DIR="$(go list -m -f '{{.Dir}}' github.com/asg017/sqlite-vec-go-bindings)"
          chmod -R u+w "$VEC_DIR/cgo" || true
          cp "$SQLITE3_DIR/sqlite3-binding.h" "$VEC_DIR/cgo/sqlite3.h"
          test -f "$VEC_DIR/cgo/sqlite3.h"
          echo "sqlite3.h installed into $VEC_DIR/cgo"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (!(Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis.exe not found after NSIS install"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$nsisDir\makensis.exe" /VERSION

      - name: Pre-compile Go packages
        shell: bash
        run: |
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe .
          rm -f _prebuild_tmp.exe

      - name: Build desktop installer
        shell: bash
        run: |
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          wails build -clean \
            -skipbindings \
            -tags "sqlite_fts5" \
            -platform "windows/amd64" \
            -nsis \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installer = "cmd/desktop/build/bin/WeKnora Lite-amd64-installer.exe"
          if (!(Test-Path $installer)) { throw "Installer not found: $installer" }
          Copy-Item $installer "artifacts/WeKnora-Lite-windows-amd64-setup.exe"

      - name: Smoke test installed desktop and startup log
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'artifacts/WeKnora-Lite-windows-amd64-setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'WeKnoraLiteSmoke'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "NSIS silent install exited $($setup.ExitCode)" }
          $app = Join-Path $installDir 'WeKnora Lite.exe'
          if (!(Test-Path $app)) { throw "Missing installed executable: $app" }
          foreach ($resource in @('config/config.yaml', 'web/index.html', 'migrations/sqlite', '.env')) {
            if (!(Test-Path (Join-Path $installDir $resource))) { throw "Missing installed resource: $resource" }
          }
          $logPath = Join-Path $env:LOCALAPPDATA 'WeKnora Lite\logs\startup.log'
          $process = $null
          try {
            $process = Start-Process -FilePath $app -WorkingDirectory $installDir -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              $process.Refresh()
              if (Test-Path $logPath) {
                $logText = Get-Content -LiteralPath $logPath -Raw -ErrorAction SilentlyContinue
                if ($logText -match 'Server is running at') { $ready = $true; break }
              }
              if ($process.HasExited) { break }
            }
            if (!(Test-Path $logPath)) { throw "Desktop did not produce startup log: $logPath" }
            if (!$ready) {
              Get-Content -LiteralPath $logPath -Tail 80
              throw 'Desktop did not reach backend readiness. See startup.log above.'
            }
            if ($process.HasExited) { throw "Desktop exited after backend startup: $($process.ExitCode)" }
            Write-Host 'PASS: installed EXE started, wrote startup.log, and reached backend readiness.'
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Preserve desktop smoke diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA 'WeKnora Lite\logs\startup.log'
          if (Test-Path $logPath) {
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            Get-Content -LiteralPath $logPath -Tail 160 | Set-Content artifacts/smoke-startup.log
          }

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: WeKnora-Lite-Startup-Diagnostics
          path: artifacts/smoke-startup.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: WeKnora-Lite-Windows
          path: artifacts/WeKnora-Lite-windows-amd64-setup.exe
          retention-days: 30

  cli:
    name: Build WeKnora CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            cli/go.sum
            client/go.sum

      - name: Build CLI
        shell: pwsh
        working-directory: cli
        run: |
          go build -trimpath -ldflags="-s -w" -o weknora.exe .

      - name: Smoke test CLI
        shell: pwsh
        working-directory: cli
        run: |
          .\weknora.exe version
          .\weknora.exe --help | Select-Object -First 20

      - uses: actions/upload-artifact@v7
        with:
          name: WeKnora-CLI-Windows
          path: cli/weknora.exe
          retention-days: 30
